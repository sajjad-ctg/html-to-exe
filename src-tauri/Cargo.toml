[package]
name = "html-to-exe-builder"
version = "0.3.1"
description = "Convert HTML5 game/app zips into portable Windows exes"
authors = ["Mohammad Sajjad Khan (MSKCTG)"]
edition = "2024"
license = "MIT"
repository = "https://github.com/sajjad-ctg/html-to-exe"
# The htx CLI is a second bin; tell tauri (and cargo) which one is the app.
default-run = "html-to-exe-builder"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "builder_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Zip validation now; export packaging next. `flate2` pins a backend
# because `zip`'s deflate-flate2 feature selects none by default.
zip = { version = "9.3", default-features = false, features = ["deflate-flate2", "deflate64"] }
flate2 = { version = "1", default-features = true }
# Icon resource patching (BeginUpdateResource/UpdateResource/EndUpdateResource)
windows = { version = "0.62", features = ["Win32_System_LibraryLoader", "Win32_UI_WindowsAndMessaging"] }
tauri-plugin-dialog = "2"
image = { version = "0.25.10", default-features = false, features = ["png"] }
# Offline-runtime fetch: download Microsoft's Fixed Version cab (ureq
# uses rustls; no openssl linkage, keeps the builder dependency-light).
ureq = { version = "2", default-features = false, features = ["tls"] }


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
