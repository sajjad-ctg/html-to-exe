[package]
name = "html-to-exe-shell"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Portable WebView2 shell that hosts embedded HTML5 games/apps."
repository = "https://github.com/sajjad-ctg/html-to-exe"

[[bin]]
name = "game-shell"
path = "src/main.rs"

[dependencies]
# Window + webview
tao = "0.37"
wry = "0.57"
# Embedded zip handling (no extra compressors; HTML5 zips use deflate/stored)
zip = { version = "9.3", default-features = false, features = ["deflate-flate2", "deflate64"] }
# Config parsing
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# URL path handling for the custom protocol
percent-encoding = "2.1"
# Ergonomic error handling
anyhow = "1"

[profile.release]
lto = "thin"
strip = true
panic = "abort"
